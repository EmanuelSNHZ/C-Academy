<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="build/css/app.css">
</head>
<body>
    <header class="header-login">
        <a href="index.html">C-Academy</a>
    </header>

    <main class="background-login">
        <section class="contenedor login">
            <h1>Iniciar Sesión</h1>
            <form id="login-form" action="/login" method="POST">
                <fieldset>
                    <label for="username">Usuario:</label>
                    <input type="text" name="user" id="username" required>

                    <label for="password">Contraseña:</label>
                    <input type="password" name="password" id="password" required>

                    <button type="submit" aria-label="Ingresar al sistema">Ingresar</button>
                </fieldset>
            </form>
            <p id="error-message" role="alert" aria-live="assertive"></p>
        </section>
    </main>

    <script src="build/js/bundle.min.js"></script>
</body>
</html>
