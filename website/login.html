<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="stylesheet" href="build/css/app.css">
</head>
<body>
    <header class="header-login">
        <a href="index.html">C-Academy</a>
    </header>

    <main class="background-login">
        <section class="contenedor login">
            <h1>Iniciar Sesión</h1>
            <form id="login-form" action="/login" method="POST">
                <div class="input-group">
                    <img src="build/resources/img/user.svg" alt="Usuario" class="icon">
                    <input type="text" placeholder="Usuario*" id="username" name="username" autocomplete="username" required>
                </div> <!-- .input-group -->

                <div class="input-group">
                    <img src="build/resources/img/lock.svg" alt="Constraseña" class="icon">
                    <input type="password" id="password" placeholder="Contraseña*" itemid="password" name="password" autocomplete="current-password" required>
                    <img src="build/resources/img/eye-closed.svg" alt="Ver Contraseña" class="toggle-password" id="togglePassword">
                </div> <!-- .input-group -->

                <button type="submit" class="btn-login">Ingresar</button>
            </form>
            <p id="error-message" role="alert" aria-live="assertive"></p>
        </section>
    </main>

    <script src="build/js/bundle.min.js"></script>
</body>
</html>
